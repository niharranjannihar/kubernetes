trigger:
- master

pool:
  vmImage: windows-latest

steps:

- powershell: |

    $headers = @{
      "Authorization" = "Api-Token $(DT_API_TOKEN)"
      "Content-Type" = "application/json"
    }

    $body = @{
      eventType = "CUSTOM_DEPLOYMENT"
      title = "Deployment $(Build.BuildNumber)"
      source = "Azure DevOps"
      deploymentName = "Azure DevOps Deployment"
      deploymentVersion = "$(Build.BuildNumber)"
      attachRules = @{
        entityIds = @(
          "SERVICE-B295005FEE0D669E"
        )
      }
      properties = @{
        "dt.event.description" = "Deployment triggered from Azure DevOps"
        BuildId = "$(Build.BuildId)"
      }
    } | ConvertTo-Json -Depth 10

    Invoke-RestMethod `
      -Uri "https://nlq64817.live.dynatrace.com/api/v2/events/ingest" `
      -Method POST `
      -Headers $headers `
      -Body $body

  displayName: 'Send Deployment Event to Dynatrace'