# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
- script: echo Hello, world!
- task: RegisterDynatraceTestrun@3
  inputs:
    dtserver: 'dynatrace_connection2'
    profile: '{   "eventDetails": {     "eventType": "Deployment",     "title": "Release $(Release.ReleaseName)",     "description": "Deployment to production",     "source": "Azure DevOps",     "customProperties": {       "BuildId": "$(Build.BuildId)"     },     "entitySelector": "Target Dynatrace entity or selector expression"   } }'
    category: 'unit'
    version: 'env:BUILD_BUILDID'
    activateDotNetAgent: true

- script: |
    echo Add other tasks to build, test, and deploy your project.
    echo See https://aka.ms/yaml
  displayName: 'Run a multi-line script'
