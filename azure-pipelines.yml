trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  system.debug: true

steps:

# Verify pipeline variables
- powershell: |
    Write-Host "Build ID: $(Build.BuildId)"
    Write-Host "Build Number: $(Build.BuildNumber)"
    Write-Host "Pipeline Name: $(Build.DefinitionName)"
    Write-Host "Sources Directory: $(Build.SourcesDirectory)"
  displayName: 'Verify Variables'

# Create Dynatrace Event JSON
- powershell: |
    @'
    {
      "deploymentName": "Azure DevOps Deployment",
      "eventType": "CUSTOM_DEPLOYMENT",
      "title": "Deployment $(Build.BuildNumber)",
      "source": "Azure DevOps",
      "timeoutMinutes": 15,
      "attachRules": {
        "entityIds": [
          "SERVICE-B295005FEE0D669E"
        ]
      },
      "properties": {
        "dt.event.description": "Deployment triggered from Azure DevOps",
        "BuildId": "$(Build.BuildId)",
        "PipelineName": "$(Build.DefinitionName)",
        "BuildNumber": "$(Build.BuildNumber)"
      }
    }
    '@ | Out-File "$(Build.SourcesDirectory)\dynatrace-event.json" -Encoding utf8
  displayName: 'Create Dynatrace Event JSON'

# Display JSON for troubleshooting
- powershell: |
    Write-Host "===== Event JSON ====="
    Get-Content "$(Build.SourcesDirectory)\dynatrace-event.json"
  displayName: 'Display Event JSON'

# Create Event in Dynatrace
- task: DynatraceIntegrationCreateEvents@0
  displayName: 'Create Dynatrace Event'
  inputs:
    DynatraceService: 'dynatrace_connection'
    apimethod: 'events'
    jsonEventFile: '$(Build.SourcesDirectory)\dynatrace-event.json'

# Completion message
- powershell: |
    Write-Host "Dynatrace event submission completed."
  displayName: 'Completion Message'